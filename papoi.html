<body>
<h1 id="texto">soy un h1 </h1>

<script>
    
//Declarar las variables
let numero1, numero2,sum;

//Solicitar y guardar el valor en las variables
numero1 =prompt("ingrese el número 1:");
numero2 =prompt ("ingrese el número 2:");
//sumar y guardar en la variable sum 
sum= numero1 + numero2;
//meter el resultado en nuestro h1
document.getElementById("texto").innerHTML =sum;


</script>
